# Dependency updates. Security updates are enabled separately in the repository settings and
# are raised immediately; the version updates below are batched weekly to keep PR noise low.
# Every Dependabot PR goes through the same CI and human review as any other change.
version: 2

updates:
  - package-ecosystem: gradle
    directories: ["/", "/build-logic"] # gradle/libs.versions.toml is shared by both builds
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # let new releases settle (and malicious ones get yanked) before adopting them
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      # These versions must move together (Kotlin compiler <-> Compose compiler <-> KMP plugins).
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "com.android.tools.build*"
          - "com.android.application"
          - "com.android.kotlin.multiplatform.library"
      androidx:
        patterns: ["androidx.*", "org.jetbrains.androidx.*"]
      testing:
        patterns: ["app.cash.turbine*", "dev.mokkery*", "com.lemonappdev*", "org.jetbrains.kotlinx.kover*", "io.github.takahirom.roborazzi*"]
      code-quality:
        patterns: ["io.gitlab.arturbosch.detekt*", "com.diffplug.spotless*", "io.nlopez.compose.rules*", "com.pinterest*"]
    # Not seen by Dependabot (only referenced from build-logic code): detekt-kotlin, ktlint, compose-rules.
    # Bump those by hand together with detekt/spotless.

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      fastlane:
        patterns: ["*"]
