# Quality gate for every pull request and for main. The single required status check is
# "CI result", which only passes when every job below passed (or was legitimately skipped).
# No secrets are used here, so the workflow is safe for Dependabot and fork pull requests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR supersedes the running check; runs on main always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci/install-tool.sh gitleaks
      - name: Scan commits
        env:
          # PRs: only the PR's commits. main: the full history.
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$LOG_OPTS" .

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          scripts/ci/install-tool.sh actionlint
          scripts/ci/install-tool.sh zizmor
      - name: actionlint (syntax, expressions, shellcheck)
        run: actionlint
      - name: zizmor (workflow security)
        run: zizmor --offline --min-severity low .github/

  lint:
    name: Lint (spotless, detekt)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # detekt SARIF -> code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          ruby: "true"
      - run: bundle exec fastlane lint
      - name: Upload detekt findings to code scanning
        # Fork and Dependabot PRs get a read-only token; their findings are still in the job log.
        if: >-
          !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' &&
          (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  test-android:
    name: Test (Android host)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          ruby: "true"
      - run: bundle exec fastlane android test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-android
          path: "**/build/reports/tests/"
          retention-days: 7

  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version name comes from tags
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          ruby: "true"
      - name: DEV debug APK
        run: bundle exec fastlane android build env:dev
      # Unsigned, but runs R8/minification exactly like the store build.
      - name: PROD release AAB (unsigned)
        run: bundle exec fastlane android build env:prod type:release format:aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-dev-debug-apk
          path: app/android/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

  ios:
    name: Test + build (iOS)
    # Always GitHub-hosted: pull request code must never run on a self-hosted runner (docs/ci-cd.md).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          ruby: "true"
          ios: "true"
      - name: Shared Kotlin tests on the iOS simulator
        run: bundle exec fastlane ios test
      - name: DEV simulator build (unsigned)
        run: bundle exec fastlane ios build env:dev
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-ios
          path: "**/build/reports/tests/"
          retention-days: 7

  dependencies:
    name: Dependency graph + review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # submit the Gradle dependency graph
      pull-requests: write # dependency-review comment on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # GitHub cannot read Gradle builds on its own; submit the resolved graph so Dependabot alerts
      # and dependency review see every library. Fork PRs have a read-only token, so they skip this.
      - name: Submit Gradle dependency graph
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Review new dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
          # Accepted risks — each needs a reason and an exit condition (docs/ci-cd.md#dependency-updates):
          #   GHSA-r937-wjx7-w2jp: kotlin-gradle-plugin 2.4.10 embedded in Gradle 9.8.1 (latest) for build-logic's
          #   kotlin-dsl; build-only (Kotlin build cache metadata). Remove when Gradle embeds Kotlin >= 2.4.20.
          allow-ghsas: GHSA-r937-wjx7-w2jp
          comment-summary-in-pr: on-failure

  result:
    name: CI result
    if: always()
    needs: [secret-scan, workflow-lint, lint, test-android, build-android, ios, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::At least one CI job did not succeed."
              exit 1
            fi
          done
