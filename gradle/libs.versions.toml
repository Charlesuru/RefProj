# Single source of truth for all dependency and plugin versions.
# Never hardcode versions in build scripts — always reference this catalog.

[versions]
# --- Build toolchain ---
kotlin = "2.4.21"
# KSP 2.x is versioned independently of Kotlin since 2.3.0.
ksp = "2.3.12"
agp = "9.4.1"
compose-multiplatform = "1.12.1"
compose-material3 = "1.9.0"

# --- Android SDK levels ---
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

# --- Kotlin libraries ---
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-collections-immutable = "0.5.2"

# --- Architecture ---
androidx-lifecycle = "2.11.0"
navigation3 = "1.1.2"
koin = "4.2.2"

# --- Data ---
ktor = "3.6.0"
multiplatform-settings = "1.3.0"
room = "2.8.5"
androidx-sqlite = "2.7.1"

# --- Observability ---
kermit = "2.2.0"
firebase-bom = "35.0.0"
google-services = "4.5.0"
firebase-crashlytics-gradle = "3.0.8"

# --- AndroidX (Android-only) ---
androidx-activity = "1.13.0"
androidx-core-splashscreen = "1.2.0"

# --- Testing ---
turbine = "1.2.1"
mokkery = "3.5.1"
konsist = "0.18.1"
kover = "0.9.11"
roborazzi = "1.76.0"
androidx-test-runner = "1.7.0"

# --- Code quality ---
detekt = "1.23.8"
# detekt 1.23.x is compiled against this Kotlin version; see QualityConventionPlugin.
detekt-kotlin = "2.0.21"
spotless = "8.10.4"

# --- Build-tool security pins ---
# Vulnerable libraries that the build toolchain (AGP 9.4.1, Android Lint, Kotlin swift-export; all latest
# stable) resolves. Build tooling only, not shipped in the app. Applied to the root build classpath
# (build.gradle.kts) and to tool classpaths (build-logic ToolClasspathPins.kt). Drop a pin once the
# toolchain itself depends on a fixed version (check: dependency review on a PR without the pin).
#   Bouncy Castle 1.80.2 (AGP)          -> fixed 1.85:    GHSA-9pwp-9qqc-pr26 (critical), GHSA-qp49-qgx5-5m26 (high), GHSA-c3fc-8qff-9hwx (moderate)
#   jose4j 0.9.5 (AGP bundletool)       -> fixed 0.9.6:   GHSA-3677-xxcr-wjqv (high)
#   jdom2 2.0.6 (AGP jetifier)          -> fixed 2.0.6.1: GHSA-2363-cqg2-863c (high)
#   commons-lang3 3.16.0 (AGP, Lint)    -> fixed 3.18.0:  GHSA-j288-q9x7-2f5v (moderate)
#   httpclient 4.5.6 (Lint)             -> fixed 4.5.13:  GHSA-7r82-7xv7-xcpj (moderate)
#   opentelemetry-api 1.41.0 (swift-export) -> fixed 1.62.0: GHSA-rcgg-9c38-7xpx (moderate)
bouncycastle = "1.86"
jose4j = "0.9.7"
jdom2 = "2.0.6.1"
commons-lang3 = "3.21.0"
httpclient = "4.5.14"
opentelemetry = "1.67.0"
ktlint = "1.8.0"
compose-rules = "0.6.8"

# --- App runtime security pins ---
# Vulnerable libraries that our dependencies pull into the shipped app. Applied as constraints in
# app/android/build.gradle.kts. Drop a pin once the depending library itself requires a fixed version.
#   Guava 31.1-android (Firebase Analytics: play-services-measurement 24.0.0) -> fixed 32.0.0: GHSA-7g45-4rm6-3mm3 (moderate)
guava-android = "33.7.2-android"

[libraries]
# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

# Lifecycle / Navigation
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# DI
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-test = { module = "io.insert-koin:koin-test" }

# Network
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Storage
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatform-settings" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }

# Observability
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

# Build-logic (convention plugins compile against these)
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

# App runtime security pins (see [versions])
guava-android = { module = "com.google.guava:guava", version.ref = "guava-android" }

# Build-tool security pins (see [versions])
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }

[bundles]
# Every library in this bundle is constrained on the build and tool classpaths. Advisories: see [versions].
build-tool-security-pins = [
  "bouncycastle-bcprov",
  "bouncycastle-bcpkix",
  "bouncycastle-bcutil",
  "jose4j",
  "jdom2",
  "commons-lang3",
  "httpclient",
  "opentelemetry-api",
]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-gradle" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (defined in build-logic/convention)
refproj-kmp-library = { id = "refproj.kmp.library" }
refproj-kmp-compose = { id = "refproj.kmp.compose" }
refproj-kmp-feature = { id = "refproj.kmp.feature" }
refproj-kmp-room = { id = "refproj.kmp.room" }
refproj-android-application = { id = "refproj.android.application" }
refproj-quality = { id = "refproj.quality" }
refproj-coverage = { id = "refproj.coverage" }
