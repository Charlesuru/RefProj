# XcodeGen spec — the Xcode project is GENERATED from this file and is not committed.
# Regenerate after any change:  cd iosApp && xcodegen generate
#
# Environments map to build configurations:  <Debug|Release>-<Dev|Sit|Stage|Prod>
# Each environment has a shared scheme:      RefProj-Dev, RefProj-Sit, RefProj-Stage, RefProj-Prod
name: RefProj

options:
  bundleIdPrefix: com.studiodraug
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug-Dev
  generateEmptyDirectories: true
  # Pins every Swift package (incl. Firebase's transitive ones) to the committed lockfile. To update:
  # change the version below, resolve in Xcode, then copy the new Package.resolved back to iosApp/.
  postGenCommand: >-
    mkdir -p RefProj.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    cp Package.resolved RefProj.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

# Firebase native SDKs (Crashlytics, Analytics), bridged to Kotlin via core:observability interfaces.
# Version policy: latest release that is at least two weeks old (docs/observability.md).
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Sit: debug
  Release-Sit: release
  Debug-Stage: debug
  Release-Stage: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Configs/Dev.xcconfig
  Release-Dev: Configs/Dev.xcconfig
  Debug-Sit: Configs/Sit.xcconfig
  Release-Sit: Configs/Sit.xcconfig
  Debug-Stage: Configs/Stage.xcconfig
  Release-Stage: Configs/Stage.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO # The Gradle build phase needs access to the repo.
    # Kotlin only builds iosArm64 + iosSimulatorArm64 (Apple silicon). No Intel simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  RefProj:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalyticsCore # Analytics without ad-ID / ad-conversion support (no advertising)
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, sv] # docs/localisation.md
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: $(ASSETCATALOG_COMPILER_APPICON_NAME) # App Store validation (ITMS-90713)
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Firebase collects nothing until FirebaseObservability.swift enables it (release builds only).
        # No advertising: ad storage, ad user data and personalisation are denied; no IDFA (AdSupport not linked).
        FirebaseCrashlyticsCollectionEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        FirebaseAppDelegateProxyEnabled: false # no method swizzling; we use no Firebase feature that needs it
    settings:
      base:
        PRODUCT_NAME: RefProj
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../app/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Map <Debug|Release>-<Env> to the Kotlin framework build type.
          if [[ "$CONFIGURATION" == Debug* ]]; then
            export KOTLIN_FRAMEWORK_BUILD_TYPE=debug
          else
            export KOTLIN_FRAMEWORK_BUILD_TYPE=release
          fi
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-}" = "YES" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      - name: Copy Firebase config
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Per-environment GoogleService-Info.plist (gitignored). Missing = Firebase stays off.
          src="$SRCROOT/Firebase/$APP_FIREBASE_DIR/GoogleService-Info.plist"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$src" ]; then
            cp "$src" "$dst"
          else
            rm -f "$dst"
            echo "warning: $src not found; crash reporting and analytics are disabled in this build (docs/secrets.md)."
          fi
      - name: Upload symbols to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          set -euo pipefail
          # Release builds with a Firebase config only: uploads the dSYM (which includes the static
          # Kotlin framework) so Crashlytics can symbolicate Swift and Kotlin frames.
          if [[ "$CONFIGURATION" == Debug* ]]; then exit 0; fi
          if [ ! -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist" ]; then exit 0; fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"

schemes:
  RefProj-Dev:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Dev }
    test: { config: Debug-Dev }
    profile: { config: Release-Dev }
    analyze: { config: Debug-Dev }
    archive: { config: Release-Dev }
  RefProj-Sit:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Sit }
    test: { config: Debug-Sit }
    profile: { config: Release-Sit }
    analyze: { config: Debug-Sit }
    archive: { config: Release-Sit }
  RefProj-Stage:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Stage }
    test: { config: Debug-Stage }
    profile: { config: Release-Stage }
    analyze: { config: Debug-Stage }
    archive: { config: Release-Stage }
  RefProj-Prod:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Prod }
    test: { config: Debug-Prod }
    profile: { config: Release-Prod }
    analyze: { config: Debug-Prod }
    archive: { config: Release-Prod }
