# XcodeGen spec — the Xcode project is GENERATED from this file and is not committed.
# Regenerate after any change:  cd iosApp && xcodegen generate
#
# Environments map to build configurations:  <Debug|Release>-<Dev|Sit|Stage|Prod>
# Each environment has a shared scheme:      RefProj-Dev, RefProj-Sit, RefProj-Stage, RefProj-Prod
name: RefProj

options:
  bundleIdPrefix: com.charlesuru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug-Dev
  generateEmptyDirectories: true

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Sit: debug
  Release-Sit: release
  Debug-Stage: debug
  Release-Stage: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Configs/Dev.xcconfig
  Release-Dev: Configs/Dev.xcconfig
  Debug-Sit: Configs/Sit.xcconfig
  Release-Sit: Configs/Sit.xcconfig
  Debug-Stage: Configs/Stage.xcconfig
  Release-Stage: Configs/Stage.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO # The Gradle build phase needs access to the repo.
    # Kotlin only builds iosArm64 + iosSimulatorArm64 (Apple silicon). No Intel simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  RefProj:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_NAME: RefProj
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../app/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, Shared]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Map <Debug|Release>-<Env> to the Kotlin framework build type.
          if [[ "$CONFIGURATION" == Debug* ]]; then
            export KOTLIN_FRAMEWORK_BUILD_TYPE=debug
          else
            export KOTLIN_FRAMEWORK_BUILD_TYPE=release
          fi
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-}" = "YES" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode

schemes:
  RefProj-Dev:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Dev }
    test: { config: Debug-Dev }
    profile: { config: Release-Dev }
    analyze: { config: Debug-Dev }
    archive: { config: Release-Dev }
  RefProj-Sit:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Sit }
    test: { config: Debug-Sit }
    profile: { config: Release-Sit }
    analyze: { config: Debug-Sit }
    archive: { config: Release-Sit }
  RefProj-Stage:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Stage }
    test: { config: Debug-Stage }
    profile: { config: Release-Stage }
    analyze: { config: Debug-Stage }
    archive: { config: Release-Stage }
  RefProj-Prod:
    build: { targets: { RefProj: all } }
    run: { config: Debug-Prod }
    test: { config: Debug-Prod }
    profile: { config: Release-Prod }
    analyze: { config: Debug-Prod }
    archive: { config: Release-Prod }
